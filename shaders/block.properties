# Mode 13h — block IDs (mc_Entity.x)
#
#   10001        : Water (gbuffers_water night tweak)
#   10950..10999 : Reserved for billboards and add-ons
#   10950        : Cross-model flora, cave vines with berries
#   10952        : Hanging mangrove propagule (flipped UV)
#   10953..10955 : Amethyst clusters by facing axis
#   10956        : Signs, standing and hanging (Flatter Signs add-on)
#   10957..10959 : Chains by axis
#   10961        : Floor torches and lanterns
#   10962        : Seagrass (hash model)
#   10964        : Bamboo stalk
#   10970        : Wall torches
#   10990        : Billy Boarding add-on blocks
#
# One ID per vertex-shader branch. 10956 and 10990 are the add-on contract
# (SPEC.md): never renumber them.
#
# Iris ignores names that don't exist in the running version, so old and new
# names sit side by side (grass/short_grass, chain/iron_chain).
# No comment lines inside a `\` continuation, and nothing after the `\`.

